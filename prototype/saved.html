<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved courses | The Cuties Classes Catalogue</title>
    <link rel="stylesheet" href="styles/catalogue.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">The Cuties Classes Catalogue</a>

      <nav aria-label="Main">
        <a href="index.html">Courses</a>
        <a href="saved.html" aria-current="page">Saved courses</a>
      </nav>
    </header>

    <main>
      <h1>Saved courses</h1>
      <p>Courses you have saved, so you can compare them before you enrol.</p>

      <ul class="course-list">
        <li>
          <article class="course-card">
            <p><strong>CSCI 3230U</strong></p>
            <h3><a href="course.html">Web Development</a></h3>
            <p>Dr. Elena Vasquezerez</p>
            <dl>
              <div>
                <dt>Schedule</dt>
                <dd>Mon &amp; Wed, 10:00&ndash;11:20</dd>
              </div>
              <div>
                <dt>Room</dt>
                <dd>ER 205</dd>
              </div>
            </dl>
            <p>
              <label><input type="checkbox" checked /> Save</label>
            </p>
          </article>
        </li>
      </ul>

      <p><a href="index.html">Browse more courses</a></p>
    </main>
  </body>
</html>
